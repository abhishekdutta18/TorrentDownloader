name: Welcome Comment

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: 'Welcome to the project! Thank you for opening your first issue. A maintainer will review it shortly.'
          pr-message: 'Welcome to the project! Thank you for your first Pull Request. We appreciate your contribution.'
