name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Cache electron and electron-builder
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci

      - name: Generate Icon
        run: |
          node -e "const fs = require('fs'); fs.mkdirSync('build', { recursive: true }); const b64 = fs.readFileSync('scripts/icon-base64.txt', 'utf8').trim(); fs.writeFileSync('build/icon.png', Buffer.from(b64, 'base64'));"

      - name: Generate Windows Icon
        if: matrix.os == 'windows-latest'
        run: |
          node -e "const fs = require('fs'); import('png-to-ico').then(m => m.default('build/icon.png')).then(buf => fs.writeFileSync('build/icon.ico', buf));"

      - name: Run Tests
        run: npx vitest run

      - name: Build and Publish Release
        run: npm run build:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
