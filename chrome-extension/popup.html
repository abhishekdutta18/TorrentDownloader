<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 380px;
      min-height: 100px;
      max-height: 500px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #111827;
      color: #f3f4f6;
      overflow-y: auto;
    }

    .header {
      background: linear-gradient(135deg, #1e3a5f 0%, #1e40af 100%);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-icon {
      font-size: 22px;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .header .count {
      margin-left: auto;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: #6b7280;
    }

    .empty-state .icon {
      font-size: 40px;
      margin-bottom: 12px;
      opacity: 0.3;
    }

    .empty-state p {
      font-size: 14px;
      line-height: 1.5;
    }

    .magnet-list {
      padding: 8px;
    }

    .magnet-item {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 6px;
      transition: all 0.15s ease;
    }

    .magnet-item:hover {
      border-color: #4b5563;
      background: #263244;
    }

    .magnet-name {
      font-size: 13px;
      font-weight: 500;
      color: #e5e7eb;
      margin-bottom: 8px;
      word-break: break-word;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .magnet-hash {
      font-size: 10px;
      color: #6b7280;
      font-family: 'SF Mono', 'Fira Code', monospace;
      margin-bottom: 10px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .actions {
      display: flex;
      gap: 6px;
    }

    .btn {
      flex: 1;
      padding: 7px 12px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.15s ease;
    }

    .btn-copy {
      background: #374151;
      color: #d1d5db;
    }

    .btn-copy:hover {
      background: #4b5563;
      color: #f9fafb;
    }

    .btn-open {
      background: #2563eb;
      color: white;
    }

    .btn-open:hover {
      background: #3b82f6;
    }

    .btn-copy-all {
      margin: 4px 8px 10px;
      background: #374151;
      color: #d1d5db;
      width: calc(100% - 16px);
    }

    .btn-copy-all:hover {
      background: #4b5563;
      color: #f9fafb;
    }

    .copied {
      background: #065f46 !important;
      color: #a7f3d0 !important;
    }

    .scanning {
      padding: 30px 20px;
      text-align: center;
      color: #6b7280;
      font-size: 13px;
    }

    .scanning .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #374151;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-bottom: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-icon">🧲</span>
    <h1>TorrentPro Catcher</h1>
    <span class="count" id="count">...</span>
  </div>
  <div id="content">
    <div class="scanning">
      <div class="spinner"></div>
      <p>Scanning page...</p>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
